name: course-pilot
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core scientific computing (from conda-forge)
  - python=3.10
  - pip
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scipy
  - scikit-learn
  - h5py
  - tqdm

  # Jupyter (from conda-forge)
  - jupyter
  - jupyterlab
  - notebook
  - ipykernel
  - nbconvert
  - ipywidgets

  # Bioinformatics (explicitly from bioconda)
  - bioconda::biopython
  - bioconda::samtools
  - bioconda::bcftools
  - bioconda::bedtools
  - bioconda::minimap2
  - bioconda::seqkit
  - bioconda::flye
  - bioconda::fastani
  - bioconda::prokka
  - bioconda::fastp
  - bioconda::bamtools

  # Nanopore tools (explicitly from bioconda)
  - bioconda::nanofilt
  - bioconda::nanoplot
  - bioconda::rasusa
  - bioconda::porechop_abi