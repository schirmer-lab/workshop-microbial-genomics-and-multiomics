channels:
  - conda-forge
  - bioconda

dependencies:
  # Core scientific computing (from conda-forge)
  - python=3.10
  - pip
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scipy
  - scikit-learn
  - h5py
  - tqdm

  # Jupyter (from conda-forge)
  - conda-forge::biopython
  - conda-forge::jupyter
  - conda-forge::jupyterlab
  - conda-forge::notebook
  - conda-forge::ipykernel
  - conda-forge::nbconvert
  - conda-forge::ipywidgets

  # Plotting
  - conda-forge::python-kaleido

  # Specialized packages
  - conda-forge::r-vegan
  - conda-forge::r-fossil
  - conda-forge::r-taxonomizr
  - conda-forge::r-languageserver

  # R and R packages (from conda-forge) - let conda resolve versions
  - conda-forge::r-base=4.3.*
  - conda-forge::r-irkernel
  - conda-forge::r-tidyverse
  - conda-forge::r-devtools
  - conda-forge::r-remotes
  - conda-forge::r-biocmanager
  - conda-forge::r-ggpubr
  - conda-forge::r-reshape2
  - conda-forge::r-ggplot2

  # Bioinformatics (full suite for x86_64 from bioconda)
  - bioconda::samtools
  - bioconda::prodigal
  - bioconda::cd-hit
  - bioconda::bowtie2
  - bioconda::metaphlan==3.0.1
  - bioconda::bcftools
  - bioconda::bedtools
  - bioconda::minimap2
  - bioconda::seqkit
  - bioconda::flye
  - bioconda::fastani
  - bioconda::prokka # This is not working (solving package never finishes)
  - bioconda::fastp
  - bioconda::bamtools
  - bioconda::blast
  - bioconda::mmseqs2
  - bioconda::bwa
  - bioconda::checkm-genome

  # Illumina tools
  - bioconda::trim-galore
  - bioconda::spades
  - bioconda::multiqc

  # Nanopore tools (explicitly from bioconda)
  - bioconda::nanofilt
  - bioconda::nanoplot
  - bioconda::rasusa
  - bioconda::porechop_abi
  - bioconda::filtlong
  - bioconda::lrge
  - bioconda::dnaapler
  - bioconda::medaka
  - bioconda::polypolish

  # R Bioconductor packages (from bioconda)
  - bioconda::bioconductor-maaslin2