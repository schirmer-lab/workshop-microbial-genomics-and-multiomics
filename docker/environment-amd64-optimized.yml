channels:
  - conda-forge
  - bioconda

dependencies:
  # Core scientific computing (from conda-forge)
  - python=3.10
  - pip
  - numpy
  - pandas
  - matplotlib
#  - seaborn
#  - scipy
#  - scikit-learn
#  - h5py
#  - tqdm

  # Package Management
  - conda-forge::uv

  # Jupyter (from conda-forge)
  - conda-forge::biopython
  - conda-forge::jupyter
  - conda-forge::jupyterlab
  - conda-forge::notebook
  - conda-forge::ipykernel
  - conda-forge::nbconvert
  - conda-forge::ipywidgets
  - conda-forge::ipython

  # Plotting (essential only)
  #- conda-forge::python-kaleido

  # R and essential R packages (from conda-forge)
  - conda-forge::r-base=4.3.*
  - conda-forge::r-irkernel
  - conda-forge::r-tidyverse
  - conda-forge::r-ggpubr
  - conda-forge::r-reshape2
  - conda-forge::r-ggplot2
  - conda-forge::r-vegan
  # Removed development packages: r-devtools, r-remotes
  - conda-forge::r-fossil
  - conda-forge::r-taxonomizr
  - conda-forge::r-biocmanager
  - conda-forge::r-languageserver

  # Essential bioinformatics tools (keep most used, remove duplicates)
  - bioconda::samtools
  - bioconda::prodigal
  - bioconda::cd-hit
  - bioconda::bowtie2
  - bioconda::metaphlan==3.0.1
  - bioconda::bcftools
  - bioconda::mmseqs2
  # - bioconda::bedtools
  - bioconda::minimap2
  - bioconda::seqkit
  - bioconda::flye
  # - bioconda::fastani
  # Removed prokka (problematic package that causes long solve times)
  - bioconda::fastp
  #- bioconda::bamtools
  - bioconda::blast
  - bioconda::bwa
  #- bioconda::checkm-genome
  - bioconda::megahit
  - bioconda::foldseek

  # Illumina tools (essential only)
  - bioconda::trim-galore
  #- bioconda::multiqc
  - bioconda::spades

  # Nanopore tools (essential subset)
  # - bioconda::nanofilt
  - bioconda::nanoplot
#  - bioconda::rasusa
  # - bioconda::porechop_abi
  - bioconda::filtlong
  - bioconda::medaka
  # Removed less commonly used: lrge, dnaapler, polypolish

  # R Bioconductor packages (essential only)
  - bioconda::bioconductor-maaslin2