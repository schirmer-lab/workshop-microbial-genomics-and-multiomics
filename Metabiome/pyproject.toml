[project]
name = "metabiome"
version = "0.1.0"
description = "High-performance metagenomics data container and analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "cython>=3.1.1",
    "fsspec>=2024.1.0",
    "importlib>=1.0.4",
    "ipykernel>=6.29.5",
    "joblib>=1.4.2",
    "nbformat>=5.10.4",
    "numpy>=1.24.0",
    "plotly>=6.0.1",
    "polars>=1.12.0",
    "pyarrow>=18.1.0",
    "pydantic>=2.11.7",
    "pyfaidx>=0.8.1.3",
    "pyfamsa>=0.5.3.post1",
    "pymongo>=4.10.1",
    "pytest>=8.3.5",
    "requests>=2.32.3",
    "rich>=14.0.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.14.1",
    "setuptools>=80.8.0",
    "statsmodels>=0.14.5",
    "tqdm>=4.67.0",
    "zarr>=2.17.0",
    "zarrs>=0.1.5",
]

[build-system]
requires = ["setuptools>=74.1.0", "wheel", "cython>=3.0.0", "numpy>=2.2.5", "pyfamsa>=0.5.3.post1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"metabiome.optimized" = ["*.pyx", "*.pxd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--rootdir=.",
]

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"

[tool.ruff]
line-length = 80
src = ["src"]
extend-include = ["*.ipynb"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
    "E501",  # line too long
    "E741",  # ambiguous variable name
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
metabiome = { path = ".", editable = true }

[tool.pixi.tasks]
